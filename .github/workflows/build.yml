name: 三平台测试与打包
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: ubuntu-22.04
            arch: x64
            target: linux
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装 Linux 图形运行库
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 fonts-noto-cjk xz-utils binutils
      - run: git --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright-core
      - name: Linux 真实桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Windows 与 macOS 真实桌面测试
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: 原生平台打包
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Linux 打包版本桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/packaged-smoke.cjs
      - name: Windows 与 macOS 打包版本桌面测试
        if: runner.os != 'Linux'
        run: node test/packaged-smoke.cjs
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Branchcraft-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
      - name: 上传测试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.target }}-${{ matrix.arch }}
          path: screenshots/**/*.png
          if-no-files-found: ignore
