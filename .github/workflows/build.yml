name: 四平台测试、打包与正式发布
on:
  push:
    branches: [main, master, feature/cross-platform]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: ubuntu-22.04
            arch: x64
            target: linux
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BRANCHCRAFT_PACKAGED_FULL: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 校验发布标签与应用版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const expected='v'+require('./package.json').version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('发布标签必须为 '+expected);"
      - name: 安装 Linux 图形运行库
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 fonts-noto-cjk xz-utils binutils
      - run: git --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright-core
      - name: Linux 真实桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Windows 与 macOS 真实桌面测试
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Linux 项目编辑器与文件树回归
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/editor-smoke.cjs && xvfb-run -a node test/project-tree-smoke.cjs
      - name: Windows 与 macOS 项目编辑器与文件树回归
        if: runner.os != 'Linux'
        run: node test/editor-smoke.cjs && node test/project-tree-smoke.cjs
      - name: 日常提交构建实际应用目录
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/build.cjs --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: 发布标签构建全部安装包
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/build.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Linux 打包版本桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/packaged-smoke.cjs
      - name: Windows 与 macOS 打包版本桌面测试
        if: runner.os != 'Linux'
        run: node test/packaged-smoke.cjs
      - name: 上传安装包
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Branchcraft-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*-mac-${{ matrix.arch }}.dmg
            release/*-mac-${{ matrix.arch }}.zip
      - name: 上传测试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            screenshots/**/*.png
            screenshots/**/*.json
          if-no-files-found: ignore

  release:
    name: 发布 GitHub 正式版本
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: 下载本次四平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: Branchcraft-*
          path: release-assets
          merge-multiple: true
      - name: 校验安装包完整性并生成校验和
        shell: bash
        run: |
          cd release-assets
          ls -lh
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-win-x64-setup.exe"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-win-x64-portable.exe"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-linux-x86_64.AppImage"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-linux-amd64.deb"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-x64.dmg"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-x64.zip"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-arm64.zip"
          sha256sum -- *.exe *.AppImage *.deb *.dmg *.zip > SHA256SUMS.txt
      - name: 更新或创建草稿、校验全部附件后公开为正式版
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            async function verifyRemoteTag() {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              let object = ref.object;
              const seen = new Set();
              while (object.type === 'tag') {
                if (seen.has(object.sha)) throw new Error('远端标签引用存在循环');
                seen.add(object.sha);
                const { data: annotated } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
                object = annotated.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error(`远端标签 ${tag} 的实际 commit ${object.sha} 与本次构建 ${context.sha} 不一致，拒绝发布`);
              }
            }
            await verifyRemoteTag();
            const dir = 'release-assets';
            const files = fs.readdirSync(dir).sort();
            if (files.length !== 9) throw new Error('预期 8 个安装包和 1 个校验和文件，实际为 ' + files.length);
            const sizes = new Map(files.map(file => {
              const stat = fs.statSync(path.join(dir, file));
              if (!stat.isFile() || stat.size === 0) throw new Error(`附件不是非空文件：${file}`);
              return [file, stat.size];
            }));
            const metadata = {
              owner, repo, name: `Branchcraft ${tag}（正式版）`, draft: true, prerelease: false,
              body: '跨平台正式版本：Windows x64、Linux x64、macOS Intel x64 与 Apple Silicon arm64。\n\n四平台单元测试、源码桌面测试及打包版桌面测试通过后发布。附件包含 SHA256SUMS.txt，请按需校验。\n\n注意：当前安装包未进行代码签名，macOS 未进行 Apple 公证，系统可能显示安全提示。'
            };
            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              if (release) {
                const response = await github.rest.repos.updateRelease({ ...metadata, release_id: release.id });
                release = response.data;
                const oldAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                  owner, repo, release_id: release.id, per_page: 100
                });
                for (const asset of oldAssets) {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              } else {
                const response = await github.rest.repos.createRelease({
                  ...metadata, tag_name: tag, target_commitish: context.sha, generate_release_notes: true
                });
                release = response.data;
              }
              for (const file of files) {
                const data = fs.readFileSync(path.join(dir, file));
                await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name: file, data });
                core.info(`已上传：${file}`);
              }
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: release.id, per_page: 100
              });
              if (assets.length !== 9 || new Set(assets.map(asset => asset.name)).size !== 9) {
                throw new Error(`远端附件数量或名称不符合预期：${assets.length}`);
              }
              for (const asset of assets) {
                if (!sizes.has(asset.name) || asset.size !== sizes.get(asset.name) || asset.state !== 'uploaded') {
                  throw new Error(`远端附件名称、大小或上传状态校验失败：${asset.name}`);
                }
              }
              await verifyRemoteTag();
              const { data: published } = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true'
              });
              core.info(`正式发布完成：${published.html_url}`);
            } catch (error) {
              if (release) {
                try {
                  await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: true, prerelease: false });
                } catch (draftError) {
                  core.error(`恢复草稿失败，请人工检查 release ${release.id}：${draftError.message}`);
                }
              }
              throw error;
            }
