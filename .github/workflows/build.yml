name: 三平台测试、打包与预发布
on:
  push:
    branches: [main, master, feature/cross-platform]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: ubuntu-22.04
            arch: x64
            target: linux
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 校验发布标签与应用版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const expected='v'+require('./package.json').version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('发布标签必须为 '+expected);"
      - name: 安装 Linux 图形运行库
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 fonts-noto-cjk xz-utils binutils
      - run: git --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright-core
      - name: Linux 真实桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Windows 与 macOS 真实桌面测试
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Linux 项目编辑器与文件树回归
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/editor-smoke.cjs && xvfb-run -a node test/project-tree-smoke.cjs
      - name: Windows 与 macOS 项目编辑器与文件树回归
        if: runner.os != 'Linux'
        run: node test/editor-smoke.cjs && node test/project-tree-smoke.cjs
      - name: 原生平台打包
        run: node scripts/build.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Linux 打包版本桌面测试
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/packaged-smoke.cjs
      - name: Windows 与 macOS 打包版本桌面测试
        if: runner.os != 'Linux'
        run: node test/packaged-smoke.cjs
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Branchcraft-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*-mac-${{ matrix.arch }}.dmg
            release/*-mac-${{ matrix.arch }}.zip
      - name: 上传测试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.target }}-${{ matrix.arch }}
          path: screenshots/**/*.png
          if-no-files-found: ignore

  release:
    name: 发布 GitHub 预发布版本
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: 下载本次四平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: Branchcraft-*
          path: release-assets
          merge-multiple: true
      - name: 校验安装包完整性并生成校验和
        shell: bash
        run: |
          cd release-assets
          ls -lh
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-win-x64-setup.exe"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-win-x64-portable.exe"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-linux-x86_64.AppImage"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-linux-amd64.deb"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-x64.dmg"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-x64.zip"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
          test -f "Branchcraft-${GITHUB_REF_NAME#v}-mac-arm64.zip"
          sha256sum -- *.exe *.AppImage *.deb *.dmg *.zip > SHA256SUMS.txt
      - name: 创建草稿、上传全部附件后公开为预发布
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            const dir = 'release-assets';
            const files = fs.readdirSync(dir).sort();
            if (files.length !== 9) throw new Error('预期 8 个安装包和 1 个校验和文件，实际为 ' + files.length);
            // 不覆盖已有版本；附件未全部上传时保留草稿，避免公开不完整版本。
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Branchcraft ${tag}（预发布）`, draft: true, prerelease: true,
              generate_release_notes: true,
              body: '跨平台预发布版本：Windows x64、Linux x64、macOS Intel x64 与 Apple Silicon arm64。\n\n四平台单元测试、源码桌面测试及打包版桌面测试通过后发布。附件包含 SHA256SUMS.txt，请按需校验。\n\n注意：当前安装包未进行代码签名，macOS 未进行 Apple 公证，系统可能显示安全提示。本版本为预发布，建议先在测试仓库中体验。'
            });
            for (const file of files) {
              const data = fs.readFileSync(path.join(dir, file));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name: file, data });
              core.info(`已上传：${file}`);
            }
            const { data: published } = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'
            });
            await core.summary.addHeading('预发布完成').addLink(tag, published.html_url).write();
